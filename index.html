<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Ο Επισκέπτης Στις Τρεις</title>
  <meta name="theme-color" content="#1a1410" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Επισκέπτης" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="menu">
    <h1>Ο Επισκέπτης Στις Τρεις</h1>
    <p class="subtitle">ένα σύντομο παιχνίδι τρόμου</p>
    <button id="startBtn">Έναρξη</button>
    <div class="controlsInfo" id="controlsDesktop">
      <p>Βελάκια — κίνηση &nbsp;|&nbsp; Ποντίκι — κοίταγμα &nbsp;|&nbsp; Space — άλμα</p>
      <p>Shift — σκύψιμο &nbsp;|&nbsp; E — αλληλεπίδραση &nbsp;|&nbsp; Esc — παύση</p>
    </div>
    <div class="controlsInfo hidden" id="controlsMobile">
      <p>Αριστερό joystick — κίνηση &nbsp;|&nbsp; Σύρε δεξιά οθόνη — κοίταγμα</p>
      <p>↑ — άλμα &nbsp;|&nbsp; E — αλληλεπίδραση</p>
    </div>
    <div id="installBanner" class="hidden">
      <span id="installText"></span>
      <button id="installActionBtn">Install</button>
      <button id="installDismissBtn">✕</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="interactPrompt" class="hidden"></div>
    <div id="objective" class="hidden"></div>
    <div id="topBanner" class="hidden"></div>
    <div id="dialogueBox" class="hidden">
      <div id="dialogueSpeaker"></div>
      <div id="dialogueText"></div>
      <div id="dialogueHint">Πάτα E</div>
    </div>
  </div>

  <div id="fadeLayer"></div>
  <div id="scareFlash"></div>
  <div id="centerText" class="hidden"></div>

  <div id="endScreen" class="hidden">
    <h1 id="endTitle"></h1>
    <p id="endSubtitle"></p>
    <button id="restartBtn">Παίξε ξανά</button>
  </div>

  <div id="mobileControls" class="hidden">
    <div id="lookZone"></div>
    <div id="joyBase"><div id="joyThumb"></div></div>
    <button id="jumpBtn">↑</button>
    <button id="interactBtnMobile">E</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
